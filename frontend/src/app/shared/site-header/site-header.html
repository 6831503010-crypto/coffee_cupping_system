<header #headerArea class="site-header" [class.compact]="!showFullNavigation()">
  <a class="brand" routerLink="/" aria-label="Coffee Cupping System home" (click)="closeMenu()">
    <span class="bean" aria-hidden="true"></span>

    <span class="brand-text">
      <strong>Coffee Cupping</strong>
      <strong>System</strong>
    </span>
  </a>

  <div class="header-actions">
    @if (showFullNavigation()) {
    <nav class="site-nav" id="sharedSiteNav" aria-label="Primary navigation" [class.open]="menuOpen()">
      <a routerLink="/" (click)="closeMenu()">HOME</a>
      <a routerLink="/guide" (click)="closeMenu()">GUIDE</a>
      <a routerLink="/about" (click)="closeMenu()">ABOUT</a>
      <a routerLink="/history" (click)="closeMenu()">HISTORY</a>
      <a routerLink="/inventory" (click)="closeMenu()">INVENTORY</a>
    </nav>
    }

    @if (showAccount()) {
    @if (currentUser(); as user) {
    <div #accountArea class="account-area" (pointerenter)="openAccountOnHover($event)"
      (pointerleave)="closeAccountOnLeave($event)" (focusout)="onAccountFocusOut($event)"
      (keydown.escape)="onAccountEscape($event)">
      <button #accountTrigger type="button" class="account-trigger" [attr.aria-expanded]="accountOpen()"
        aria-controls="sharedAccountDropdown" [attr.aria-label]="
          'Account options for ' + user.name +
          (user.qualificationStatus === 'QUALIFIED'
            ? ', qualified evaluator'
            : '')
        "
        (click)="accountOpen.set(true)" (keydown.arrowdown)="
              accountOpen.set(true);
              $event.preventDefault()
            ">
        <span class="account-avatar" aria-hidden="true">
          {{ userInitial() }}
        </span>

        <span class="account-details">
          <span class="account-name-row">
            <strong class="account-name" [title]="user.name">
              {{ user.name }}
            </strong>

            @if (user.qualificationStatus === 'QUALIFIED') {
            <span class="qualification-badge" title="Qualified evaluator" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="currentColor" />
                <path d="m7.5 12 3 3 6-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            }
          </span>
          <span class="account-email" [title]="user.email">
            {{ user.email }}
          </span>
        </span>

        <svg class="account-chevron" [class.expanded]="accountOpen()" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <div id="sharedAccountDropdown" class="account-dropdown" [hidden]="!accountOpen()">
        <div class="account-dropdown-panel">
          <button type="button" class="account-logout" [disabled]="loggingOut()" (click)="logout()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <!-- Door -->
              <path d="M9 4H4v16h5" />

              <!-- Arrow pointing out -->
              <path d="M10 12h10" />
              <path d="m16 8 4 4-4 4" />
            </svg>
            <span>
              {{ loggingOut() ? 'Logging out…' : 'Log out' }}
            </span>
          </button>
        </div>
      </div>
    </div>
    }
    }

    @if (showFullNavigation()) {
    <button class="menu-toggle" type="button" [attr.aria-label]="
          menuOpen() ? 'Close navigation' : 'Open navigation'
        " [attr.aria-expanded]="menuOpen()" aria-controls="sharedSiteNav" (click)="toggleMenu()">
      ☰
    </button>
    }
  </div>
</header>
