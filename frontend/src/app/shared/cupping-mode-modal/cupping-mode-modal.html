<dialog #cuppingModeDialog class="cupping-mode-dialog" aria-labelledby="modeDialogTitle"
  aria-describedby="modeDialogDescription" (click)="onModeDialogClick($event)">

  <div class="mode-dialog-header">
    <div>
      <h2 id="modeDialogTitle">
        Choose Cupping Mode
      </h2>

      <p id="modeDialogDescription">
        How would you like to start your
        coffee cupping session?
      </p>
    </div>

    <button type="button" class="mode-close-btn" aria-label="Close dialog" (click)="closeModeDialog()">
      &times;
    </button>
  </div>

  <div class="mode-options">

    <button type="button" class="mode-option" (click)="selectIndividualMode()">

      <span class="mode-option-icon" aria-hidden="true">
        ☕
      </span>

      <strong>Individual Cupping</strong>

      <span class="mode-option-description">
        Create a session, choose evaluators,
        and select coffee samples.
      </span>

      <span class="mode-action">
        Continue →
      </span>
    </button>

    <button type="button" class="mode-option" (click)="selectOrganizationalMode()">
      <span class="mode-option-icon" aria-hidden="true">
        ♙
      </span>

      <strong>Organizational Cupping</strong>

      <span class="mode-option-description">
        Manage a cupping session as organizer
        and invite up to 10 evaluators.
      </span>

      <span class="mode-action">
        Continue →
      </span>
    </button>

  </div>
</dialog>
