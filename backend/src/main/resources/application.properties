spring.application.name=coffee-cupping-api

# Load local developer settings if the file exists
spring.config.import=optional:classpath:application-local.properties

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/coffee_cupping_db

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Server
server.port=${PORT:8080}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Flyway creates the Spring Session tables
spring.session.jdbc.initialize-schema=never

# Expire login sessions after 60 minutes of inactivity
spring.session.timeout=60m
